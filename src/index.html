    Kindle viewport: target the physical ~600 CSS-px width, disable user scaling
    so the Kindle browser doesn't auto-zoom and break the layout.
  -->

  <!-- Disable color schemes — Kindle is always grayscale -->
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
