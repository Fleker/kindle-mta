@if (!hasStops()) {
  <app-setup />
} @else {
  <div class="board">
    <header class="board-header">
      <h1 class="board-title">MTA Board</h1>
      @if (lastRefresh()) {
        <span class="board-updated">{{ formatRefreshTime(lastRefresh()) }}</span>
      }
    </header>

    <main class="board-stops">
      @for (sa of stopArrivals(); track sa.stop.id) {
        <app-transit-card [stopArrivals]="sa" />
      }
    </main>

    <footer class="board-footer">
      <app-alerts-panel [alerts]="alerts()" [loading]="alertsLoading()" />
    </footer>
  </div>
}
